# Grafana + Prometheus stack for the percentiles demo (system-wide view).
#
#   1) run the Go server on the host:   go run .
#   2) from this folder:                docker compose up -d
#   3) open Grafana:                    http://localhost:3000  (admin / admin)
#      the "System Percentiles" dashboard is auto-provisioned.
#   4) generate traffic:                go run ./loadtest
#
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: highload-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # let the container reach the host

  grafana:
    image: grafana/grafana:latest
    container_name: highload-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
