syntax = "proto2";
package blog;

import "google/protobuf/timestamp.proto";

option go_package = "./pb";

enum PostStatus {
  POST_STATUS_UNDEFINED = 0;
  POST_STATUS_DRAFT = 1;
  POST_STATUS_PUBLISHED = 2;
  POST_STATUS_DELETED = 3;
}

message Post {
  required uint64 id = 1 [json_name = "id"];
  required uint64 author_id = 2 [json_name = "author_id"];
  required string author_name = 3 [json_name = "author_name"];
  required string title = 4 [json_name = "title"];
  required string body = 5 [json_name = "body"];
  repeated string tags = 6 [json_name = "tags"];
  required PostStatus status = 7 [json_name = "status"];
  required uint64 like_count = 8 [json_name = "like_count"];
  required uint64 comment_count = 9 [json_name = "comment_count"];
  required int32 version = 10 [json_name = "version"]; // optimistic lock

  required google.protobuf.Timestamp created_at = 101 [json_name = "created_at"];
  required google.protobuf.Timestamp updated_at = 102 [json_name = "updated_at"];
}

message PostCreate {
  required string title = 1 [json_name = "title"];
  required string body = 2 [json_name = "body"];
  repeated string tags = 3 [json_name = "tags"];
  optional string idempotency_key = 4 [json_name = "idempotency_key"]; // a retry with the same key returns the first result
}

message PostUpdate {
  required uint64 id = 1 [json_name = "id"];
  required string title = 2 [json_name = "title"];
  required string body = 3 [json_name = "body"];
  required int32 version = 4 [json_name = "version"]; // must equal the stored version
}

message PostListRequest {
  optional uint64 author_id = 1 [json_name = "author_id"];
  optional string tag = 2 [json_name = "tag"];
  optional string cursor = 3 [json_name = "cursor"]; // last id of the previous page
  optional int32 limit = 4 [json_name = "limit"];
}

message PostList {
  repeated Post posts = 1 [json_name = "posts"]; // body is a 300-character excerpt
  optional string next_cursor = 2 [json_name = "next_cursor"];
}

message PostLikeRequest {
  required uint64 post_id = 1 [json_name = "post_id"];
}

message UploadUrlRequest {
  required string content_type = 1 [json_name = "content_type"];
}

// The client POSTs a multipart form to upload_url: every form_fields entry,
// then the image as the last field, "file". The fields carry a signed policy,
// so the store itself rejects another content type, a file over the size
// limit, or another key.
message UploadUrl {
  required string upload_url = 1 [json_name = "upload_url"];
  required string image_url = 2 [json_name = "image_url"];
  map<string, string> form_fields = 3 [json_name = "form_fields"];
}
